[project]
name = "food-ordering-backend"
version = "0.1.0"
description = "FastAPI backend for a real-time food ordering and delivery tracking system."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.5,<2.0.0",
    "anthropic>=2.3.0,<3.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "sqlalchemy>=2.0.42,<3.0.0",
    "greenlet>=3.0.0,<4.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "aiosqlite>=0.21.0,<1.0.0",
    "redis>=6.2.0,<7.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "pytest>=8.4.1,<9.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
